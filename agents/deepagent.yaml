# The deepAgent adapter: deepagents-code (dcode) driven over ACP stdio.
# Values agree with aeval/agents/deepagent/agent.py — the declaration is
# validated against the class (a disagreement is an error). Source-backed
# facts: docs/TESTS/DEEPAGENTS-FACTS.md.
extends: _base/agent.base.yaml

id: deepagent
version: "1"
import_path: "aeval.agents.deepagent.agent:DeepgentAgent"

provides:
  - acp_stdio
  - shell
  - file_tools

mode: acp_stdio
# Metered through the gateway lease: dcode speaks OpenAI, our broker speaks
# aeval-model-broker/3, and the in-sandbox facade (control_stack below)
# translates between them under the trial's job token. The adapter points the
# agent at that facade automatically (facade_routing_env), so this claim and
# the deployment move together — a suite that declares a spend cap is now
# enforced rather than refused.
budget_enforcement: gateway_lease

# The generic control stack (P2-5b): NOT the DSH flavor. dcode is started by
# Harbor's own ACP runner, so there is no plugin tree to graft — aeval uploads
# the self-contained facade, starts it in the background and health-gates it
# before the run proceeds. The fixed port is a shared contract
# (contracts.FACADE_BASE_URL) the adapter points the agent at.
control_stack: deepagent-facade
transcript:
  source: native_session_via_bridge
  reader: harbor-acp-runner
  capabilities:
    - atif_via_bridge
    - token_usage
  fields_available:
    events: ok
    token_usage: partial

# dcode is a Python package run through uvx; the Node observation is
# DSH-specific. (Inherited from the base as [] — restated for readability.)
# The sandbox image must nevertheless ship node: the facade runs on it.
observations: []

sandbox_home: /root/.deepagents
# Relative to the DESCRIPTOR's directory, i.e. to Harbor's agent log directory
# (/logs/agent, downloaded to <trial_dir>/agent/): the ACP runner writes its
# summary at that root. There is no deepagent-home tree — declaring one made
# every real run fail with "session_root does not exist" (example-lab, P2-5b).
session_artifact_dir: "."

# The generic facade only proxies model traffic: nothing in the sandbox ever
# sees an exit, so the owner observes the agent's own record at agent end and
# states the terminal outcome itself (aeval.agents.contract). Which file that
# record is belongs to the adapter, not to the framework.
terminal_descriptor_owner: host
sandbox_session_record: /logs/agent/acp-summary.json

# How this adapter is launched in a deployment. The registry entry (uvx
# deepagents-code==0.1.78 --acp) is built by the adapter itself, so the
# profile carries only deployment facts: the uvx install of the pinned
# package needs a generous setup window. Model routing (OPENAI_BASE_URL /
# OPENAI_API_KEY / …) is supplied per job via the adapter's model_env kwarg,
# which lands in the launcher env — never baked into a committed file.
launch:
  default:
    override_setup_timeout_sec: 900
