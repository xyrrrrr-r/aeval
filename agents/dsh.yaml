# The shipped DSH adapter. Values agree with aeval/agents/dsh/agent.py — the
# declaration is validated against the class (a disagreement is an error).
extends: _base/agent.base.yaml

id: dsh
version: "1"
import_path: "aeval.agents.dsh.agent:DshAgent"

provides:
  - acp_stdio
  - sdk_jsonrpc
  - shell
  - file_tools
  - resume

mode: acp_stdio
budget_enforcement: gateway_lease
transcript:
  source: native_session_via_bridge
  reader: dsh-official-session-reader
  capabilities:
    - atif_via_bridge
    - claim_check
    - token_usage
  fields_available:
    events: ok
    token_usage: ok

# Observed in the live sandbox and bound to the lock: the Node runtime the DSH
# release is pinned against.
observations:
  - node

# The in-sandbox control stack this adapter needs (job token, session minting,
# the cordis patch). Declared, so the framework never deploys it into another agent.
control_stack: dsh

# Model traffic routing (AGENT-ABSTRACTION-2 §4.1): DSH's control-stack
# transport speaks the broker wire (aeval-model-broker/3) natively, so there
# is no facade to deploy and no facade env to inject — the composition skips
# both on this declaration.
model_routing:
  agent_protocol: gateway_native

sandbox_home: /logs/agent/dsh-home
session_artifact_dir: dsh-home

# Evidence artifacts this adapter produces. The session-record slot's fixed
# path is declared here (and mirrored on the class as
# SESSION_RECORD_OUTPUT_PATH, cross-checked at load): the value is
# byte-identical to the path the framework hardcoded before the slot
# generalised, so historical bundles and plans recompute identically.
artifacts:
  - name: dsh-session-record
    slot: dsh_session
    path: sessions/session.v4.jsonl.zstd

# How this adapter is launched in a deployment. These paths are cluster facts
# (install prefix, npm cache, where the official session reader is mounted), so
# they bind to an environment rather than to the adapter's identity — which is
# exactly why they live here instead of in every job file that runs DSH.
launch:
  # Verified on example-lab (openEuler 24.03 SP1 aarch64); matches the paths the
  # hand-written jobs/e2e-hello/jobs/dsh.yaml used.
  default:
    override_setup_timeout_sec: 900
    kwargs:
      install_prefix: "/dev/shm/dshpkg"
      npm_cache: "/dev/shm/npmcache"
      session_reader: "/opt/aeval/session_reader.js"
      run_timeout_sec: 600
  # The TerminaBench cluster arm. npm_cache is pre-baked in the base image, and
  # the session reader ships inside the control bundle mounted at /root/src.
  lab:
    override_setup_timeout_sec: 900
    kwargs:
      install_prefix: "/dev/shm/dshpkg"
      npm_cache: "/root/.npm"
      session_reader: "/root/src/dsh-eval-control/dist/session_reader.js"
      run_timeout_sec: 900
