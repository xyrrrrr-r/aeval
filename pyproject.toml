[project]
name = "aeval-harbor"
version = "0.1.1"
description = "Agent trajectory evaluation framework built on Harbor"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # P0-2: the e2b extra is the sandbox backend for the target
    # environment. This is an approved dependency change per doc §4.2 —
    # review the lock churn when installing on the Linux host and never
    # treat the new transitive versions as verified until recorded.
    "harbor[e2b]==0.23.0",
    # Environment-verification finding (example-lab, openEuler 24.03 aarch64):
    # the self-hosted e2b cluster (api:3000 / client-proxy:3002) implements
    # only the v1 sandbox API. e2b>=2.51.0 switched sandbox creation to
    # POST /v2/sandboxes, which that API rejects with
    # "404: validation error: method not allowed", so the upper bound is
    # required. The lower bound is harbor 0.23.0's own requirement
    # (e2b>=2.25.0): 2.24.0 is where SandboxNetworkUpdate — imported by
    # harbor's e2b backend — first exists. 2.50.0 is the newest release
    # that still speaks the v1 API.
    "e2b>=2.25.0,<2.51.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.2",
    # cryptography 是传递依赖（harbor → pyjwt[crypto]），本包不直接 import。
    # 50.x 起不再发布 Intel macOS wheel（仅 macosx_11_0_arm64；Linux 与
    # Apple Silicon 不受影响），pip/uv 在 Intel Mac 上会退化为 Rust 源码
    # 构建（几十分钟，无可写用户缓存目录的环境直接失败）。因此仅在
    # darwin+x86_64 用环境标记压到 <45——44.0.3 有实测可用的
    # cp39-abi3-macosx_10_9_universal2 wheel；其余平台标记为假，
    # cryptography 保持传递依赖、正常解析最新 wheel。
    # （0.1.0 曾把此约束放在 [tool.uv] 下，pip 不识别，0.1.1 提升至此。）
    "cryptography<45; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
keywords = [
    "agent",
    "evaluation",
    "eval",
    "trajectory",
    "benchmark",
    "harbor",
    "llm",
    "deterministic",
    "pass-at-k",
    "evidence",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://gitcode.com/open_kunpeng_agentic_infra/aeval"
Repository = "https://gitcode.com/open_kunpeng_agentic_infra/aeval"
Issues = "https://gitcode.com/open_kunpeng_agentic_infra/aeval/issues"
Changelog = "https://gitcode.com/open_kunpeng_agentic_infra/aeval/blob/main/CHANGELOG.md"

[project.scripts]
aeval = "aeval.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "hypothesis>=6.108.0",
]

[build-system]
# hatchling 1.28+ 会产出 Metadata-Version: 2.5，而当前 twine check /
# PyPI 校验链尚不识别（InvalidDistribution），上传会被拒。锁在 1.27.x
# （产出 2.4）直到发布工具链跟上——升级前先跑 `uvx twine check dist/*`。
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
