[project]
name = "aeval-harbor"
version = "0.1.1"
description = "Agent trajectory evaluation framework built on Harbor"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # The e2b extra is the sandbox backend. This pin is deliberate: the
    # upstream release line moved sandbox creation to the v2 API, which
    # older self-hosted e2b deployments do not serve. Before bumping,
    # re-verify against the deployment you actually target and record the
    # result; the lock file churns on every bump.
    "harbor[e2b]==0.23.0",
    # Upper bound: e2b>=2.51.0 creates sandboxes via POST /v2/sandboxes,
    # which a v1-only self-hosted cluster (api:3000 / client-proxy:3002)
    # rejects with "404: validation error: method not allowed". 2.50.0 is
    # the newest release that still speaks the v1 API.
    # Lower bound: harbor 0.23.0 requires e2b>=2.25.0, and 2.24.0 lacks
    # SandboxNetworkUpdate, which harbor's e2b backend imports.
    "e2b>=2.25.0,<2.51.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.2",
    # cryptography 是传递依赖（harbor → pyjwt[crypto]），本包不直接 import。
    # 50.x 起不再发布 Intel macOS wheel（仅 macosx_11_0_arm64；Linux 与
    # Apple Silicon 不受影响），pip/uv 在 Intel Mac 上会退化为 Rust 源码
    # 构建（几十分钟，无可写用户缓存目录的环境直接失败）。因此仅在
    # darwin+x86_64 用环境标记压到 <45——44.0.3 有实测可用的
    # cp39-abi3-macosx_10_9_universal2 wheel；其余平台标记为假，
    # cryptography 保持传递依赖、正常解析最新 wheel。
    # （0.1.0 曾把此约束放在 [tool.uv] 下，pip 不识别，0.1.1 提升至此。）
    "cryptography<45; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
keywords = [
    "agent",
    "evaluation",
    "eval",
    "trajectory",
    "benchmark",
    "harbor",
    "llm",
    "deterministic",
    "pass-at-k",
    "evidence",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://gitcode.com/open_kunpeng_agentic_infra/aeval"
Repository = "https://gitcode.com/open_kunpeng_agentic_infra/aeval"
Issues = "https://gitcode.com/open_kunpeng_agentic_infra/aeval/issues"
Changelog = "https://gitcode.com/open_kunpeng_agentic_infra/aeval/blob/main/CHANGELOG.md"

[project.scripts]
aeval = "aeval.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "hypothesis>=6.108.0",
]

[build-system]
# hatchling 1.28+ 会产出 Metadata-Version: 2.5，而当前 twine check /
# PyPI 校验链尚不识别（InvalidDistribution），上传会被拒。锁在 1.27.x
# （产出 2.4）直到发布工具链跟上——升级前先跑 `uvx twine check dist/*`。
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeval"]

# 内部资料不进 sdist：
#  - docs/internal/ 是开发过程的历史记录（内部阶段编号、缺陷编号、机器名、
#    实测数据），对使用者不可读，也不应随包分发。
#  - ops/e2b/ 是内部运维工具（自托管 e2b 集群的加固脚本、部署钩子），面向的是
#    我们自己的服务器，不含任何面向使用者的接口；其中的默认主机名也不该外泄。
# 使用者指南（docs/guides/）与图示（docs/images/、docs/diagrams/）随包分发。
[tool.hatch.build.targets.sdist]
exclude = [
    "/docs/internal",
    "/ops/e2b",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
