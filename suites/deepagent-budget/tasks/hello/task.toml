schema_version = "1.4"

[environment]
# 同 e2e-hello：镜像在 environment/Dockerfile 的 FROM 里按 digest 钉死。
#
# 出网只留 broker 主机：agent 的 CLI 是镜像里预装的（自举不需要 PyPI），但
# façade 在**沙箱内**跑，它必须能到达宿主侧的 broker —— no-network 下这条
# 链路必挂（真实目标机实测：façade 起不来，日志 `fetch failed`），所以这里
# 用 allowlist 只放行 broker，和真实目标机上 DSH run 的写法一致。不允许 public：
# baseline_arrival 的 egress 门会拒绝 public。
network_mode = "allowlist"
allowed_hosts = ["193.126.4.2"]

[[verifier.collect]]
# 会话记录槽位是 agent_session_record（本套件 driver.session_record），
# 不是 DSH 的 dsh_session —— deepagent 的官方会话记录是 ACP runner 的
# summary，由宿主侧 collection 经适配器的 read_session_record() 采集。
command = "aeval-collect runtime_dump mock_call_log agent_session_record canonical_transcript"

[metadata.provenance]
source = "authored-internally"
license = "MIT"
