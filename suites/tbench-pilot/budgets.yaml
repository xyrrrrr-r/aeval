# Pilot budgets — the single declaration of the trial budget.
#
# Two consumers must never drift apart:
#
#   * the model broker (`limits.maxSteps` / `limits.maxTokens`, enforced
#     during the trial and mirrored into the control config the sandbox
#     adapter compares), generated by tools/gen_broker_spec.py from this
#     file;
#   * the trajectory grader (max_steps / max_tokens), which measures step
#     and token efficiency AGAINST the budget the trial actually ran
#     under.
#
# tests/unit/suites/test_tbench_pilot_suite.py asserts that the grader's
# constants equal these values, so a budget change that touches only one
# side fails in CI instead of silently re-scaling every efficiency score.
broker:
  # The e2e-hello chain ran with maxSteps 8 (enough for a one-file task).
  # Terminal-bench tasks are multi-step: inspect, edit, verify, repeat.
  maxSteps: 60
  maxTokens: 2000000
  # Single-response cap. 512 (the hello value) truncates code-writing
  # turns; 4096 leaves room for a full file rewrite, but MEASURED on the
  # second clean pilot run it also aborted a trial: the sqlite task's
  # agent emitted a long byte-level page analysis, hit the cap, and DSH's
  # one-shot run ended the turn with reason max-tokens and exited
  # non-zero. A non-zero agent exit loses the session's content-level
  # ownership evidence, so the trial produced no store record and the run
  # refused to seal (a fail-closed gate doing its job — but over a budget
  # artifact, not an agent failure). 8192 lets a full analysis turn plus
  # a file rewrite finish. MEASURED across the pilot's trials the normal
  # peak is well under 8k (hello-world ~90, openssl ~0.8k, sqlite 2.7k-6.5k),
  # but the sqlite task's byte-level page analysis reached exactly 8192 twice
  # and killed the turn; 16384 keeps the declared cap far above real turns so
  # a verbose-but-valid analysis cannot cost the run its seal (D52).
  maxOutputTokens: 16384
  # D47: compaction is ALLOWED and ACCOUNTED. The dispatch is metered and
  # ledgered by the sandbox transport (gateway_aux_dispatches.jsonl), and
  # the mapper merges it into the trial's accounted token totals.
  # session-title is left unset, so it keeps the fail-closed default
  # (refused before dispatch, provably zero tokens).
  auxiliaryPolicy:
    compaction: allow
grader:
  max_steps: 60
  max_tokens: 2000000
agent:
  # Per-trial agent wall clock (job yaml kwargs.run_timeout_sec).
  run_timeout_sec: 900
