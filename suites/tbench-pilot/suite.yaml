schema_version: 2
id: tbench-pilot
# 0.2.0（2026-09-30）：准入规则变更 —— 驱动能力要求收窄为任务真正需要的
# [acp_stdio, shell]（去掉 DSH 专属的 sdk_jsonrpc），会话槽位改为显式声明。对 DSH 的
# 被测结果没有变化，但"谁能被这个评测集接受"变了，因此版本进位：本版本的跑次
# 不与 0.1.0 同域可比。
version: 0.2.0
# 与 e2e-hello 共用同一份环境级基座：时钟、ready 观测点与 baseline
# （证明跑的是"被适配过的镜像"而不是上游原镜像）、六项 requirements、
# 驱动能力 [acp_stdio, sdk_jsonrpc]、指标种类、datasets 路径约定。
extends: _base/harbor.base.yaml
harbor:
  job: jobs/tbench-m0.yaml
observables:
  # file: sources only (P0-2: db:/screenshot:/dom: probes fail closed).
  # `reward` is published by the upstream verifier (tests/test.sh) during
  # the verifier phase; `ready` comes from the base.
  - { name: reward, type: string, source: "file:/logs/verifier/reward.txt" }
verdict:
  graders:
    # The outcome layer is the upstream verifier's own verdict; the
    # trajectory layer adds the framework rubric and vetoes a pass that
    # was obtained by reading the tests or the oracle solution.
    # 注意：带 veto 的 grader 不能继承，必须在本套件里显式声明 ——
    # veto 改变"什么叫通过"，这是套件自己的判定策略。
    default: { impl: "graders/tbench_outcome.py@v1", layer: outcome }
    trajectory: { impl: "graders/tbench_trajectory.py@v1", layer: trajectory, veto: true }
metrics:
  # pass^3: the probability that all three attempts of a task pass.
  - { id: reliability, kind: pass_pow_k, k: 3 }
driver:
  # 驱动能力要求是套件自己的事实（基座不含）：这三个 Terminal-Bench 任务真正
  # 需要的是 ACP 通道 + 能在沙箱里跑命令，因此只要求这两项。刻意不写
  # sdk_jsonrpc（DSH 特有通道）——那会让本评测集无条件只接受 DSH；要限制或
  # 放开某个 agent 家族，改的就是这里，且必须是一次显式的评测决策。
  require: [acp_stdio, shell]
  # 会话记录槽位显式声明（框架默认值恰好是 DSH 的 dsh_session；写出事实而不是
  # 依赖默认值）。换 agent 家族要连同这里一起显式改。
  session_record: dsh_session
  # The collect command below runs the task's OWN verifier, and the
  # suite reads the reward it publishes. Harbor uploads the task's
  # tests only at verification time — after collection — so aeval
  # stages them once the agent has stopped (see DriverSpec).
  stage_tests_before_collect: true
  # Every vendored task's Dockerfile ends with WORKDIR /app and its tests
  # hardcode /app (hello-world says "the current directory"), so the DSH
  # session is minted in /app and the agent runs there. The owner default
  # (/workspace) made all three tasks fail on a real run.
  workspace_dir: "/app"
  # DSH confines the shell with a bwrap/Landlock runner: the local sandbox
  # backend probes for one at first use and refuses the command outright
  # when the image ships neither — which this sealed image does not
  # (measured: "no sandbox backend is usable on this host"). Terminal-Bench
  # tasks need a working shell; without this, only hello-world (file tools
  # alone) was answerable. The isolation boundary for a sealed trial is the
  # disposable per-trial microVM, so DSH's own inner confinement is off.
  #
  # 这是 DSH 自己的开关，因此写在 dsh 命名空间下：框架不认识它（不做任何
  # 解释），由 dsh flavor 校验并翻译成 DSH_PERMISSION_MODE 注入 agent 的运行
  # 环境。别的家族要自己的开关，就用自己 flavor 的名字另开一个命名空间。
  control_options:
    dsh:
      permission_mode: "danger-full-access"
provenance:
  source: "terminal-bench-core@0.1.1 (https://github.com/laude-institute/terminal-bench @ 91e10457b5410f16c44364da1a34cb6de8c488a5)"
  source_url: "https://github.com/laude-institute/terminal-bench"
  imported_at: "2025-09-24"
  converter_version: "aeval-vendor-tbench/1"
  license: "Apache-2.0"
  data_imported: true
  rewritten_by_us: true
