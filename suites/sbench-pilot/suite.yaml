schema_version: 2
id: sbench-pilot
# 0.1.0（2026-10-05）：服务基准试点套件 —— 源方案《Benchmark 测评指
# 标设计方案》§2 的 16 类 148 用例中，14 个服务类共 123 例的框架迁
# 移。判分层只有 outcome 一层（② 道）：每个用例的执行脚本（按分类
# 生成的 tests/check_<category>.py）直接探测引擎端点并发布 reward；
# 被测对象是引擎服务，agent 在这类用例里保持待命（nop），一个闲置
# agent 的轨迹不是信号，所以不设轨迹层——会话质量类用例见
# aeval-intel 套件（① 道），跨会话记忆见其 fork 用例（④ 道）。
#
# 任务树由共享用例库（aeval/cases/）按 cases.yaml 声明的类别注入
# 生成：用例清单的唯一事实源是库里各类别 checker 的 CASES 表（任务
# id 即源方案的 <category>.<case> 点分命名）。引擎 API 形态是按源
# 方案描述约定的合理形态（见库 README），对齐真实引擎时改 checker
# 重新注入即可。
version: 0.1.0
extends: _base/harbor.base.yaml
harbor:
  job: jobs/sbench-smoke.yaml
driver:
  # 驱动只需要 ACP 通道 + 会话记录（agent 待命）；采集计划与
  # aeval-intel 相同：dsh_session + canonical_transcript + reward。
  require: [acp_stdio, shell]
  session_record: dsh_session
observables:
  # 用例执行脚本（verifier）在验证阶段发布 reward；ready 来自基座。
  - { name: reward, type: string, source: "file:/logs/verifier/reward.txt" }
verdict:
  graders:
    # 唯一判分层：内容寻址 reward（同 tbench 模式）。服务自查的
    # 结果二值：检查通过 = 1，检查失败（含引擎不可达，原因随
    # verifier 日志留痕）= 0。
    default: { impl: "graders/sbench_outcome.py@v1", layer: outcome }
metrics:
  # 服务自查是确定性检查：单次尝试，pass^1 即通过率。
  - { id: reliability, kind: pass_pow_k, k: 1 }
provenance: { source: authored-internally, license: MIT }
